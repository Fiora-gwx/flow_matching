experiment_name: ft_clock_mechanism_analysis
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  analysis_num_bins: 20
  analysis_num_batches: 8
  analysis_num_samples: 512
  sampling_solver: heun2
  eval_nfes: [10, 20, 50]
experiments:
  - name: linear_ft_beta_0_3
    path_family: linear
    clock_family: ft_linear_beta
    clock_beta: 0.3
  - name: linear_ft_beta_0_5
    path_family: linear
    clock_family: ft_linear_beta
    clock_beta: 0.5
  - name: linear_ft_beta_0_7
    path_family: linear
    clock_family: ft_linear_beta
    clock_beta: 0.7
  - name: trig_vp_ft_beta_0_3
    path_family: trig_vp
    clock_family: ft_vp_beta
    clock_beta: 0.3
  - name: trig_vp_ft_beta_0_5
    path_family: trig_vp
    clock_family: ft_vp_beta
    clock_beta: 0.5
  - name: trig_vp_ft_beta_0_7
    path_family: trig_vp
    clock_family: ft_vp_beta
    clock_beta: 0.7
