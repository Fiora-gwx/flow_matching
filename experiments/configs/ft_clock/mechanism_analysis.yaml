experiment_name: ft_clock_mechanism_analysis_uparam
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  image_size: 32
  batch_size: 128
  cfg_scale: 0.0
  class_drop_prob: 1.0
  analysis_num_bins: 20
  analysis_num_batches: 8
  analysis_num_samples: 512
  sampling_solver: heun2
  eval_nfes: [10, 20, 50]
experiments:
  - name: linear_uniform
    path_family: linear
    clock_family: uniform
    checkpoint_from:
      artifact_group: ft_clock_linear_main_uparam
      checkpoint_epoch: 499
  - name: linear_ft_beta_0_3
    path_family: linear
    clock_family: ft_beta
    clock_beta: 0.3
