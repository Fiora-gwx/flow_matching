# Compare the same FT-best checkpoint under three solvers at a shared exact-NFE budget.
# Run with:
# python3 experiments/plot_sampling_progression.py --config experiments/configs/ft_clock/sampling_progression_solver_compare.yaml
device: cuda
seed: 0
num_samples: 8
grid_nrow: 4
image_size: 32
snapshot_ratios: [0.0, 0.08, 0.17, 0.33, 0.5, 0.75, 1.0]
output_dir: experiments/results/sampling_progression_solver_compare

methods:
  - label: Heun2
    dataset: cifar10
    name: linear_ft_best
    path_family: linear
    clock_family: ft_beta
    best_beta_from:
      results_csv: experiments/results/ft_clock_linear_main_uparam/results.csv
      artifact_group: ft_clock_linear_main_uparam
      dataset: cifar10
      path_family: linear
      solver: heun2
      metric: fid
      selection_nfes: [6, 8, 10, 15, 20, 30, 50, 100]
      clock_family: ft_beta
    checkpoint_from:
      artifact_group: ft_clock_linear_main_uparam
      source_name_template: linear_ft_beta_{clock_beta_tag}
      checkpoint_epoch: 499
    sampling_solver: heun2
    eval_nfe: 12
    cfg_scale: 0.0
    fixed_label: 0

  - label: RK3
    dataset: cifar10
    name: linear_ft_best
    path_family: linear
    clock_family: ft_beta
    best_beta_from:
      results_csv: experiments/results/ft_clock_linear_main_uparam/results.csv
      artifact_group: ft_clock_linear_main_uparam
      dataset: cifar10
      path_family: linear
      solver: heun2
      metric: fid
      selection_nfes: [6, 8, 10, 15, 20, 30, 50, 100]
      clock_family: ft_beta
    checkpoint_from:
      artifact_group: ft_clock_linear_main_uparam
      source_name_template: linear_ft_beta_{clock_beta_tag}
      checkpoint_epoch: 499
    sampling_solver: rk3
    eval_nfe: 12
    cfg_scale: 0.0
    fixed_label: 0

  - label: STORK-4
    dataset: cifar10
    name: linear_ft_best
    path_family: linear
    clock_family: ft_beta
    best_beta_from:
      results_csv: experiments/results/ft_clock_linear_main_uparam/results.csv
      artifact_group: ft_clock_linear_main_uparam
      dataset: cifar10
      path_family: linear
      solver: heun2
      metric: fid
      selection_nfes: [6, 8, 10, 15, 20, 30, 50, 100]
      clock_family: ft_beta
    checkpoint_from:
      artifact_group: ft_clock_linear_main_uparam
      source_name_template: linear_ft_beta_{clock_beta_tag}
      checkpoint_epoch: 499
    sampling_solver: stork4
    eval_nfe: 12
    cfg_scale: 0.0
    fixed_label: 0
