experiment_name: ft_clock_trig_vp_global_uparam
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  epochs: 500
  batch_size: 128
  num_gpus: 4
  path_family: trig_vp
  sampling_solver: heun2
  model_output_type: base_velocity
  time_sampling_strategy: ds_dr_sq
  cfg_scale: 0.0
  class_drop_prob: 1.0
  metrics: [fid, precision_recall, inception_score]
  eval_epochs: [499]
  eval_nfes: [10, 20, 50]
experiments:
  - name: trig_vp_uniform
    clock_family: uniform
    checkpoint_from:
      artifact_group: ft_clock_trig_vp
      source_exp_name: trig_vp_uniform
      checkpoint_epoch: 499
  - name: trig_vp_ft_beta_0_3
    clock_family: ft_beta
    clock_beta: 0.3
  - name: trig_vp_ft_beta_0_5
    clock_family: ft_beta
    clock_beta: 0.5
  - name: trig_vp_ft_beta_0_7
    clock_family: ft_beta
    clock_beta: 0.7
