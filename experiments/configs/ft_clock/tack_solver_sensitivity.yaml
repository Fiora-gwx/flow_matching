experiment_name: ft_clock_tack_solver_sensitivity
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  epochs: 500
  batch_size: 128
  num_gpus: 4
  model_output_type: base_velocity
  time_sampling_strategy: ds_dr_sq
  cfg_scale: 0.0
  class_drop_prob: 1.0
  metrics: [fid, precision_recall, inception_score]
  precision_recall_neighbors: 3
  precision_recall_max_samples: 10000
  eval_epochs: [499]
  eval_nfes: [6, 8, 10, 12, 18, 20, 24, 30, 48, 50, 96]
  sampling_solver: tack
  tack_profile_grid_size: 64
  tack_profile_batch_size: 256
  tack_profile_num_batches: 8
  tack_profile_eps: 1.0e-8
  tack_lambda: 1.0
  tack_eta: 0.25
  tack_profile_cache: true
  tack_force_recompute_profile: false
  tack_chi_lo: 0.10
  tack_chi_hi: 0.50
  tack_tau: 0.05
  tack_startup_steps: 2
  tack_enable_dyadic: true
  tack_batch_shared_adapt: true
  tack_min_dr_scale: 0.25
  tack_max_dr_scale: 4.0
  tack_monitor_estimator: auto
  tack_mode: full

experiments:
  - name: linear_uniform_tack
    path_family: linear
    clock_family: uniform
    checkpoint_from:
      artifact_group: ft_clock_linear_main
      source_exp_name: linear_uniform
      checkpoint_epoch: 499

  - name: linear_ft_beta_0_3_tack
    path_family: linear
    clock_family: ft_beta
    clock_beta: 0.3
    checkpoint_from:
      artifact_group: ft_clock_linear_main
      source_exp_name: linear_ft_beta_0_3
      checkpoint_epoch: 499

  - name: linear_ft_beta_0_5_tack
    path_family: linear
    clock_family: ft_beta
    clock_beta: 0.5
    checkpoint_from:
      artifact_group: ft_clock_linear_main
      source_exp_name: linear_ft_beta_0_5
      checkpoint_epoch: 499

  - name: trig_vp_uniform_tack
    path_family: trig_vp
    clock_family: uniform
    checkpoint_from:
      artifact_group: ft_clock_trig_vp
      source_exp_name: trig_vp_uniform
      checkpoint_epoch: 499

  - name: trig_vp_ft_beta_0_3_tack
    path_family: trig_vp
    clock_family: ft_beta
    clock_beta: 0.3
    checkpoint_from:
      artifact_group: ft_clock_trig_vp
      source_exp_name: trig_vp_ft_beta_0_3
      checkpoint_epoch: 499
