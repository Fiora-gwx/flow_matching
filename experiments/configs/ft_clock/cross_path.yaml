experiment_name: ft_clock_cross_path
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  epochs: 500
  batch_size: 128
  num_gpus: 4
  sampling_solver: heun2
  metrics: [fid]
  eval_epochs: [499]
  eval_nfes: [10, 20, 50]
experiments:
  - name: linear_uniform
    path_family: linear
    clock_family: uniform
  - name: linear_ft_beta_0_3
    path_family: linear
    clock_family: ft_linear_beta
    clock_beta: 0.3
  - name: linear_ft_beta_0_5
    path_family: linear
    clock_family: ft_linear_beta
    clock_beta: 0.5
  - name: linear_ft_beta_0_7
    path_family: linear
    clock_family: ft_linear_beta
    clock_beta: 0.7
  - name: trig_vp_uniform
    path_family: trig_vp
    clock_family: uniform
  - name: trig_vp_ft_beta_0_3
    path_family: trig_vp
    clock_family: ft_vp_beta
    clock_beta: 0.3
  - name: trig_vp_ft_beta_0_5
    path_family: trig_vp
    clock_family: ft_vp_beta
    clock_beta: 0.5
  - name: trig_vp_ft_beta_0_7
    path_family: trig_vp
    clock_family: ft_vp_beta
    clock_beta: 0.7
