experiment_name: ft_clock_cross_path
# FT entries are resolved automatically from the aggregated linear E1 and VP E4 results.
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  epochs: 500
  batch_size: 128
  num_gpus: 4
  sampling_solver: heun2
  cfg_scale: 0.0
  class_drop_prob: 1.0
  metrics: [fid, inception_score]
  eval_epochs: [499]
  eval_nfes: [10, 20, 50]
experiments:
  - name: linear_uniform
    path_family: linear
    clock_family: uniform
    checkpoint_from:
      artifact_group: ft_clock_linear_main
      source_exp_name: linear_uniform
      checkpoint_epoch: 499
  - name: linear_ft_best
    path_family: linear
    clock_family: ft_linear_beta
    best_beta_from:
      results_csv: experiments/results/ft_clock_linear_main/results.csv
      artifact_group: ft_clock_linear_main
      dataset: cifar10
      path_family: linear
      solver: heun2
      metric: fid
      selection_nfes: [10, 20, 50]
      clock_family: ft_linear_beta
    checkpoint_from:
      artifact_group: ft_clock_linear_main
      source_name_template: linear_ft_beta_{clock_beta_tag}
      checkpoint_epoch: 499
  - name: trig_vp_uniform
    path_family: trig_vp
    clock_family: uniform
    checkpoint_from:
      artifact_group: ft_clock_trig_vp
      source_exp_name: trig_vp_uniform
      checkpoint_epoch: 499
  - name: trig_vp_ft_best
    path_family: trig_vp
    clock_family: ft_vp_beta
    best_beta_from:
      results_csv: experiments/results/ft_clock_trig_vp/results.csv
      artifact_group: ft_clock_trig_vp
      dataset: cifar10
      path_family: trig_vp
      solver: heun2
      metric: fid
      selection_nfes: [10, 20, 50]
      clock_family: ft_vp_beta
    checkpoint_from:
      artifact_group: ft_clock_trig_vp
      source_name_template: trig_vp_ft_beta_{clock_beta_tag}
      checkpoint_epoch: 499
