experiment_name: ft_clock_ge_stork_linear_uniform_12way
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  epochs: 500
  batch_size: 128
  num_gpus: 4
  path_family: linear
  clock_family: uniform
  model_output_type: base_velocity
  time_sampling_strategy: ds_dr_sq
  cfg_scale: 0.0
  class_drop_prob: 1.0
  metrics: [fid]
  eval_epochs: [499]
  eval_nfes: [6, 12, 18, 24, 30, 48, 96]
  checkpoint_from:
    artifact_group: ft_clock_linear_main
    source_exp_name: linear_uniform
    checkpoint_epoch: 499
  shared_clock_mode: ge_stork
  shared_clock_physical_grid_size: 65
  shared_clock_pilot_solver: heun2
  shared_clock_pilot_batch_size: 16
  shared_clock_pilot_num_batches: 4
  shared_clock_eps: 1.0e-6
  shared_clock_jacobian_backend: probe
  shared_clock_jacobian_num_probes: 4
  shared_clock_optimizer_steps: 200
  shared_clock_optimizer_lr: 0.05

experiments:
  - name: linear_uniform_ge_stork_va_euler
    sampling_solver: euler
    shared_clock_family: va

  - name: linear_uniform_ge_stork_va_heun2
    sampling_solver: heun2
    shared_clock_family: va

  - name: linear_uniform_ge_stork_va_stork4
    sampling_solver: stork4
    shared_clock_family: va

  - name: linear_uniform_ge_stork_vb_euler
    sampling_solver: euler
    shared_clock_family: vb

  - name: linear_uniform_ge_stork_vb_heun2
    sampling_solver: heun2
    shared_clock_family: vb

  - name: linear_uniform_ge_stork_vb_stork4
    sampling_solver: stork4
    shared_clock_family: vb

  - name: linear_uniform_ge_stork_aa_euler
    sampling_solver: euler
    shared_clock_family: aa

  - name: linear_uniform_ge_stork_aa_heun2
    sampling_solver: heun2
    shared_clock_family: aa

  - name: linear_uniform_ge_stork_aa_stork4
    sampling_solver: stork4
    shared_clock_family: aa

  - name: linear_uniform_ge_stork_ab_euler
    sampling_solver: euler
    shared_clock_family: ab

  - name: linear_uniform_ge_stork_ab_heun2
    sampling_solver: heun2
    shared_clock_family: ab

  - name: linear_uniform_ge_stork_ab_stork4
    sampling_solver: stork4
    shared_clock_family: ab
