experiment_name: ft_clock_schedule_family_uparam
# The FT entry is resolved automatically from E1 aggregated CIFAR-10 linear results.
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  epochs: 500
  batch_size: 128
  num_gpus: 4
  path_family: linear
  sampling_solver: heun2
  cfg_scale: 0.0
  class_drop_prob: 1.0
  metrics: [fid, inception_score]
  eval_epochs: [499]
  eval_nfes: [10, 20, 50]
experiments:
  - name: linear_uniform
    clock_family: uniform
    checkpoint_from:
      artifact_group: ft_clock_linear_main_uparam
      source_exp_name: linear_uniform
      checkpoint_epoch: 499
  - name: linear_poly_a0_5
    clock_family: poly_a0.5
  - name: linear_poly_a2_0
    clock_family: poly_a2.0
  - name: linear_cosine
    clock_family: cosine
  - name: linear_sigmoid_k8
    clock_family: sigmoid_k8
  - name: linear_exp_l3
    clock_family: exp_l3
  - name: linear_ft_best
    clock_family: ft_beta
    best_beta_from:
      results_csv: experiments/results/ft_clock_linear_main_uparam/results.csv
      artifact_group: ft_clock_linear_main_uparam
      dataset: cifar10
      path_family: linear
      solver: heun2
      metric: fid
      selection_nfes: [10, 20, 50]
      clock_family: ft_beta
    checkpoint_from:
      artifact_group: ft_clock_linear_main_uparam
      source_name_template: linear_ft_beta_{clock_beta_tag}
      checkpoint_epoch: 499
