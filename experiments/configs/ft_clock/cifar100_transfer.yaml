experiment_name: ft_clock_cifar100_transfer
# The FT entry is resolved automatically from E1 aggregated CIFAR-10 linear results.
base_config:
  dataset: cifar100
  data_path: ./data/cifar100
  epochs: 500
  batch_size: 128
  num_gpus: 4
  path_family: linear
  sampling_solver: heun2
  cfg_scale: 0.0
  class_drop_prob: 1.0
  metrics: [fid, precision_recall]
  eval_epochs: [499]
  eval_nfes: [10, 20, 50]
experiments:
  - name: cifar100_linear_uniform
    clock_family: uniform
  - name: cifar100_linear_ft_best
    clock_family: ft_linear_beta
    best_beta_from:
      results_csv: experiments/results/ft_clock_linear_main/results.csv
      artifact_group: ft_clock_linear_main
      dataset: cifar10
      path_family: linear
      solver: heun2
      metric: fid
      selection_nfes: [10, 20, 50]
      clock_family: ft_linear_beta
