experiment_name: ft_clock_cifar100_transfer
base_config:
  dataset: cifar100
  data_path: ./data/cifar100
  epochs: 500
  batch_size: 128
  num_gpus: 4
  path_family: linear
  sampling_solver: heun2
  metrics: [fid, precision_recall]
  eval_epochs: [499]
  eval_nfes: [10, 20, 50]
experiments:
  - name: cifar100_linear_uniform
    clock_family: uniform
  - name: cifar100_linear_ft_beta_0_3
    clock_family: ft_linear_beta
    clock_beta: 0.3
  - name: cifar100_linear_ft_beta_0_5
    clock_family: ft_linear_beta
    clock_beta: 0.5
  - name: cifar100_linear_ft_beta_0_7
    clock_family: ft_linear_beta
    clock_beta: 0.7
