experiment_name: ft_clock_solver_sensitivity
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  epochs: 500
  batch_size: 128
  num_gpus: 4
  cfg_scale: 0.0
  class_drop_prob: 1.0
  metrics: [fid, precision_recall, inception_score]
  precision_recall_neighbors: 3
  precision_recall_max_samples: 10000
  eval_epochs: [499]
  eval_nfes: [6, 12, 18, 24, 30, 48, 96]
experiments:
  - name: linear_uniform_euler
    path_family: linear
    sampling_solver: euler
    clock_family: uniform
    checkpoint_from:
      artifact_group: ft_clock_linear_main
      source_exp_name: linear_uniform
      checkpoint_epoch: 499
  - name: linear_uniform_heun2
    path_family: linear
    sampling_solver: heun2
    clock_family: uniform
    checkpoint_from:
      artifact_group: ft_clock_linear_main
      source_exp_name: linear_uniform
      checkpoint_epoch: 499
  - name: linear_uniform_rk3
    path_family: linear
    sampling_solver: rk3
    clock_family: uniform
    checkpoint_from:
      artifact_group: ft_clock_linear_main
      source_exp_name: linear_uniform
      checkpoint_epoch: 499
  - name: linear_uniform_stork4
    path_family: linear
    sampling_solver: stork4
    clock_family: uniform
    eval_nfes: [6, 8, 10, 12, 18, 20, 24, 30, 48, 50, 96]
    checkpoint_from:
      artifact_group: ft_clock_linear_main
      source_exp_name: linear_uniform
      checkpoint_epoch: 499

  - name: linear_ft_beta_0_3_euler
    path_family: linear
    sampling_solver: euler
    clock_family: ft_linear_beta
    clock_beta: 0.3
    checkpoint_from:
