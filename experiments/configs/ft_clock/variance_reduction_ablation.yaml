experiment_name: ft_clock_variance_reduction_ablation
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  epochs: 500
  batch_size: 128
  num_gpus: 4
  path_family: linear
  cfg_scale: 0.0
  class_drop_prob: 1.0
  metrics: [fid]
  eval_epochs: [499]
  eval_nfes: [4, 8, 16, 32, 100]

