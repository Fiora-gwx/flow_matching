experiment_name: "alpha_sweep_ema"
base_config:
  dataset: "cifar10"
  data_path: "/home/gwx/flow_matching/data/cifar10"
  epochs: 900
  batch_size: 128
  num_gpus: 4

experiments:
  # === Baseline (Alpha 0.5) ===
  - name: "base_0.5"
    alpha: 0.5
    use_ft_eqm: false
    # 评估多个检查点，看收敛速度
    eval_epochs: [99, 199, 299, 399, 499,599,699,799,899]
    # 对每个检查点，看不同步数的表现
    eval_nfes: [4,10, 20, 50, 100]

