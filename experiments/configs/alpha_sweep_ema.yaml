experiment_name: alpha_sweep_ema
# Legacy filename retained; this is now an EMA beta sweep under FT-clock naming.
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  epochs: 900
  batch_size: 128
  num_gpus: 4
  path_family: linear
  sampling_solver: heun2
  cfg_scale: 0.0
  class_drop_prob: 1.0
  use_ema: true
  metrics: [fid]
experiments:
  - name: linear_uniform_ema
    clock_family: uniform
    eval_epochs: [99, 199, 299, 399, 499, 599, 699, 799, 899]
    eval_nfes: [4, 10, 20, 50, 100]
  - name: linear_ft_beta_0_2_ema
    clock_family: ft_linear_beta
    clock_beta: 0.2
    eval_epochs: [99, 199, 299, 399, 499, 599, 699, 799, 899]
    eval_nfes: [4, 10, 20, 50, 100]
  - name: linear_ft_beta_0_3_ema
    clock_family: ft_linear_beta
    clock_beta: 0.3
    eval_epochs: [99, 199, 299, 399, 499, 599, 699, 799, 899]
    eval_nfes: [4, 10, 20, 50, 100]
  - name: linear_ft_beta_0_4_ema
