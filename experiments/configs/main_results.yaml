experiment_name: "main_results"
base_config:
  dataset: "cifar10"
  data_path: "./data/cifar10"
  epochs: 500
  batch_size: 128
  num_gpus: 4

experiments:
  - name: "base_alpha0.5"
    alpha: 0.5
    use_ft_eqm: false
    importance_weighting: false
    eval_nfes: [4, 10, 20, 50, 100]

  - name: "fteqm_alpha0.6"
    alpha: 0.6
    use_ft_eqm: true
    importance_weighting: true
    eval_nfes: [4, 10, 20, 50, 100]