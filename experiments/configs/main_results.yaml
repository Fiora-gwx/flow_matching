experiment_name: main_results_uparam
# Legacy filename retained; content has been migrated to FT-clock naming.
base_config:
  dataset: cifar10
  data_path: ./data/cifar10
  epochs: 500
  batch_size: 128
  num_gpus: 4
  path_family: linear
  sampling_solver: heun2
  cfg_scale: 0.0
  class_drop_prob: 1.0
  metrics: [fid, precision_recall]
  eval_epochs: [499]
experiments:
  - name: linear_uniform_main
    clock_family: uniform
    eval_nfes: [4, 10, 20, 50, 100]
  - name: linear_ft_beta_0_5_main
    clock_family: ft_beta
    clock_beta: 0.5
    eval_nfes: [4, 10, 20, 50, 100]
